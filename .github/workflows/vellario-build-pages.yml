name: VELLARIO generate canonical static pages
on:
  push:
    branches: [main]
    paths:
      - mobile/catalog.json
      - mobile/site-content.json
      - mobile/build_site.py
      - .github/workflows/vellario-build-pages.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vellario-static-pages-main
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true
      - name: Build canonical 15 pages with Python standard library
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile mobile/build_site.py
          out="$(mktemp -d)"
          rootout="$(mktemp -d)"
          python3 mobile/build_site.py --out "$out" --root-out "$rootout" --site-data mobile/site-content.json --catalog mobile/catalog.json
          python3 - "$out" <<'PY'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1])
          manifest=json.loads((root/'route-manifest.json').read_text())
          assert manifest['count']==15, manifest['count']
          assert manifest['redirectCount']==17, manifest['redirectCount']
          home=(root/'index.html').read_text()
          assert home.count('data-model-film')==7, home.count('data-model-film')
          for name in ['MAS 52','MAS 56','Lariocab','FY70']:
              assert name in home, name
          for r in manifest['routes']:
              page=(root/r['path']).read_text()
              assert '<main' in page and '<h1' in page, r['slug']
              if 'data-yacht-rail' in page:
                  assert page.count('<a class="model-card')==8, r['slug']
          for id in ['mas-52','mas-56','lariocab','fy70']:
              assert (root/'collezione'/id/'index.html').exists()
          mas52=(root/'collezione'/'mas-52'/'index.html').read_text()
          mas56=(root/'collezione'/'mas-56'/'index.html').read_text()
          assert 'mas56-film-wide.mp4' in mas52
          assert 'mas56-film-wide.mp4' not in mas56.split('<main id="main-content">',1)[1].split('</section>',1)[0]
          assert 'owner-mas56-' in mas56
          print('PASS 15 routes / 8 cards / FY70 film / distinct MAS52+MAS56 / safe fallback')
          PY
          python3 - "$rootout" <<'PYROOT'
          import json, pathlib, sys
          root=pathlib.Path(sys.argv[1]); manifest=json.loads((root/'route-manifest.json').read_text())
          assert manifest['count']==15 and manifest['redirectCount']==17
          home=(root/'index.html').read_text()
          assert '<main' in home and '<h1' in home
          assert 'http-equiv="refresh"' not in home, 'Root must render directly, never redirect to /mobile/'
          assert 'href="./heritage/"' in home and 'href="./como-dolcevita/"' in home and 'href="./artisanship/"' in home and 'href="./collezione/"' in home
          assert 'href="./mobile/site.css?v=v41-native-scroll"' in home
          assert 'src="./mobile/site.js?v=v41-native-scroll"' in home
          assert 'src="assets/brand/' in home
          for entry in manifest['routes']:
              page=(root/entry['path']).read_text()
              assert '<main' in page and '/mobile/site.js?v=v41-native-scroll' in page, entry['slug']
              assert ('../'*(len(pathlib.Path(entry['path']).parts)-1)+'assets/') in page, entry['slug']
          from xml.etree import ElementTree as ET
          ns={'s':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          entries=ET.parse(root/'sitemap.xml').findall('s:url/s:loc',ns)
          actual=[el.text for el in entries]
          base='https://mconforzi.github.io/vellario-como-site/'
          expected=[base+(entry['slug']+'/' if entry['slug'] else '') for entry in manifest['routes']]
          assert actual==expected, 'Sitemap must list exactly 16 canonical routes in approved order'
          assert len(set(actual))==15 and all('/mobile/' not in u for u in actual)
          print('PASS sitemap.xml: XML valid / 15 canonical loc / zero redirects or mirrors')
          print('PASS root 15 routes / 17 legacy redirects / working links / shared assets')
          PYROOT
          cp -a "$out/." mobile/
          cp -a "$rootout/." .
      - name: Publish generated routes without changing source assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VELLARIO build bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile index.html route-manifest.json heritage artisanship como-dolcevita como dolce-vita collezione storia-tradizione design-saper-fare casa-vellario contatti collection history-legacy design-craftsmanship maison contact sitemap.xml
          if git diff --cached --quiet; then
            echo "Static pages already up to date"
            exit 0
          fi
          git commit -m "build(vellario): regenerate seven pillars and eight models [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
